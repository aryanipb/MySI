name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MYSI_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "MYSI_KEYSTORE_BASE64 is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed APKs and Play bundle
        env:
          MYSI_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          MYSI_KEYSTORE_PASSWORD: ${{ secrets.MYSI_KEYSTORE_PASSWORD }}
          MYSI_KEY_ALIAS: ${{ secrets.MYSI_KEY_ALIAS }}
          MYSI_KEY_PASSWORD: ${{ secrets.MYSI_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease bundleRelease

      - name: Name artifacts and write checksums
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "dist/MySI-${GITHUB_REF_NAME}-arm64.apk"
          cp app/build/outputs/apk/release/app-x86_64-release.apk "dist/MySI-${GITHUB_REF_NAME}-x86_64.apk"
          cp app/build/outputs/apk/release/app-universal-release.apk "dist/MySI-${GITHUB_REF_NAME}-universal.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/MySI-${GITHUB_REF_NAME}.aab"
          # R8's map from obfuscated to real names, needed to read crash stack traces from this
          # build (Play Console takes it under "ReTrace mapping file"). The .aab also carries it.
          cp app/build/outputs/mapping/release/mapping.txt "dist/MySI-${GITHUB_REF_NAME}-mapping.txt"
          (cd dist && sha256sum *.apk *.aab *-mapping.txt > SHA256SUMS.txt)

      - name: Keep the R8 mapping with the run
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ github.ref_name }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "MySI $GITHUB_REF_NAME" --generate-notes --verify-tag

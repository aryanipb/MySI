org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# Google Form that receives in-app AI content reports (see Reports.kt). Public by design: it ships
# inside every APK and only accepts reports. MYSI_REPORT_URL overrides it.
mysi.reportUrl=https://docs.google.com/forms/d/e/1FAIpQLSc4Svw_u3-2Oa6wHQSgdGbXQeQ_zeqLPlatQt7CdMsNMegJzQ/viewform?usp=pp_url&entry.1402317904=category&entry.1042570851=reply&entry.269791927=details&entry.287533740=prompt&entry.772030896=model&entry.759158330=app_version
# R8's integrated resource shrinker (the AGP 8.13 default) cannot build an app bundle while ABI
# split APKs are on (it fails with "Multiple shrunk-resources files found", issuetracker 402800800).
# MySI builds both in one run, so release resources are shrunk by AGP's separate resource shrinker.
android.r8.integratedResourceShrinking=false
